      --navy-light: #1a3460;
      --gold:       #c9a84c;
      --gold-light: #e8c97a;
      --gold-pale:  #f5e9c8;
      --white:      #fafaf8;
      --cream:      #f2ead8;
      --text-dark:  #1a1a2e;
      --glass:      rgba(13, 31, 60, 0.72);

    html { scroll-behavior: smooth; }
    body {
      font-family: 'Noto Serif TC', serif;
      background: var(--navy);
      color: var(--white);
      overflow-x: hidden;
    }

      width: 100%;
      height: 100vh;
      min-height: 620px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #bg-photo {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: opacity 1.2s ease;
      z-index: 0;
    }
    #bg-photo::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        160deg,
        rgba(13,31,60,0.78) 0%,
        rgba(13,31,60,0.45) 40%,
        rgba(13,31,60,0.70) 100%
      );
    }

    /* Decorative gold lines */
    .deco-line {
      position: absolute;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      height: 1px;
      width: 60%;
      opacity: 0.5;
    }
    .deco-line.top { top: 18%; left: 20%; }
    .deco-line.bottom { bottom: 18%; left: 20%; }

    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 0 24px;
      animation: fadeUp 1.4s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(32px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .hero-eyebrow {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(1rem, 2.2vw, 1.4rem);
      letter-spacing: 0.25em;
      color: var(--gold-light);
      margin-bottom: 16px;
      opacity: 0.9;
    }

    .hero-days-wrapper {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 16px;
      margin-bottom: 8px;
    }
    .hero-label-pre {
      font-family: 'Noto Serif TC', serif;
      font-weight: 300;
      font-size: clamp(1.2rem, 3vw, 2rem);
      color: var(--cream);
      letter-spacing: 0.1em;
    }
    .hero-number {
      font-family: 'Playfair Display', serif;
      font-size: clamp(5rem, 18vw, 11rem);
      font-weight: 700;
      color: var(--gold);
      line-height: 1;
      text-shadow: 0 4px 40px rgba(201,168,76,0.4);
      letter-spacing: -0.02em;
    }
    .hero-label-post {
      font-family: 'Noto Serif TC', serif;
      font-weight: 300;
      font-size: clamp(1.2rem, 3vw, 2rem);
      color: var(--cream);
      letter-spacing: 0.1em;
    }

    .hero-title {
      font-family: 'Noto Serif TC', serif;
      font-weight: 600;
      font-size: clamp(1.3rem, 3.5vw, 2.2rem);
      color: var(--white);
      letter-spacing: 0.12em;
      margin-bottom: 32px;
    }

    .hero-divider {
      width: 80px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 0 auto 28px;
    }

    .quote-block {
      max-width: 680px;
      margin: 0 auto;
      padding: 24px 32px;
      border: 1px solid rgba(201,168,76,0.3);
      border-radius: 2px;
      background: var(--glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: relative;
    }
    .quote-block::before, .quote-block::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      border-color: var(--gold);
      border-style: solid;
      opacity: 0.6;
    }
    .quote-block::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
    .quote-block::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

    .quote-zh {
      font-family: 'Noto Serif TC', serif;
      font-weight: 400;
      font-size: clamp(1rem, 2.2vw, 1.25rem);
      color: var(--white);
      line-height: 1.8;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }
    .quote-en {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(0.88rem, 1.8vw, 1.05rem);
      color: var(--gold-light);
      line-height: 1.6;
      letter-spacing: 0.04em;
    }

    .hero-date {
      position: absolute;
      bottom: 32px;
      right: 40px;
      z-index: 2;
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.85rem;
      letter-spacing: 0.18em;
      color: rgba(245,233,200,0.6);
      text-transform: uppercase;
    }

    .scroll-hint {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      opacity: 0.5;
      animation: bounce 2.4s ease infinite;
    }
    .scroll-hint span {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      color: var(--gold-light);
    }
    .scroll-arrow {
      width: 1px;
      height: 36px;
      background: linear-gradient(to bottom, var(--gold), transparent);
    }
    @keyframes bounce {
      0%,100% { transform: translateX(-50%) translateY(0); }
      50%      { transform: translateX(-50%) translateY(8px); }
    }

    /* ═══════════════════════════════════════
       PROGRESS BAR
    ═══════════════════════════════════════ */
    .progress-bar-wrap {
      background: var(--navy-light);
      padding: 18px 40px;
      border-bottom: 1px solid rgba(201,168,76,0.15);
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      color: var(--gold-pale);
      opacity: 0.7;
    }
    .progress-track {
      width: 100%;
      height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
      border-radius: 2px;
      transition: width 1s ease;
    }

    /* ═══════════════════════════════════════
       FOOTER CARDS
    ═══════════════════════════════════════ */
    .footer-band {
      background: var(--navy-light);
      border-top: 1px solid rgba(201,168,76,0.15);
      padding: 48px 40px;
    }
    .footer-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 24px;

    .footer-card {
      padding: 24px;
      border: 1px solid rgba(201,168,76,0.18);
      border-radius: 4px;
      background: rgba(255,255,255,0.025);
      display: flex;
      flex-direction: column;
      gap: 10px;

      font-size: 0.88rem;
      letter-spacing: 0.15em;
      color: var(--gold-light);

      font-weight: 300;
      font-size: 0.8rem;

      color: rgba(245,233,200,0.3);

      .progress-bar-wrap { padding: 14px 20px; }
      .footer-band { padding: 32px 16px; }
      .hero-date { display: none; }
      .quote-block { padding: 16px 20px; }

</head>

// ── Utility: parse 'YYYY-MM-DD' as local date
function parseLocalDate(str) {
  const [y, m, d] = str.split('-').map(Number);
  return new Date(y, m - 1, d);
}

// ── Utility: floor difference in days
function daysBetween(a, b) {
  const msPerDay = 86400000;
  return Math.floor((b - a) / msPerDay);
}


// ── Photo loading: random from nyc_001.jpg … nyc_020.jpg (different each page load)
function setBgPhoto(elapsed) {
  const bgEl = document.getElementById('bg-photo');
  const n = String(Math.floor(Math.random() * TOTAL_PHOTOS) + 1).padStart(3, '0');
  const url = `nyc_${n}.jpg`;

  const img = new Image();
  img.onload = () => {
    bgEl.style.backgroundImage = `url(${url})`;
    bgEl.style.backgroundSize = 'cover';
    bgEl.style.backgroundPosition = 'center';
  };
  img.onerror = () => {
    // Fallback gradient if photo file missing
    bgEl.style.background =
      'linear-gradient(160deg, #050d1a 0%, #0d1f3c 35%, #152845 55%, #0a1828 80%, #060e1c 100%)';
  };
  img.src = url;
}

// ── Main init
(function init() {
  const startDate = parseLocalDate(START_DATE);
  const today = new Date();
  today.setHours(0,0,0,0);
  startDate.setHours(0,0,0,0);

  const elapsed = daysBetween(startDate, today); // 0 on Day 100
  const currentDay = 100 - elapsed;              // Day 100 on start, counts down

  // Hero
  const displayDay = currentDay > 0 ? currentDay : (currentDay === 0 ? '🎉' : '✈️');
  document.getElementById('days-number').textContent = displayDay;

  // Quote index: Day 100 → index 0, Day 99 → index 1, …, Day 1 → index 99
  const qIdx = Math.min(Math.max(100 - currentDay, 0), 99);
  const [zh, en] = QUOTES[qIdx];
  document.getElementById('quote-zh').textContent = zh;
  document.getElementById('quote-en').textContent = en;

  // Date string
  const dateStr = today.toLocaleDateString('zh-TW', { year:'numeric', month:'long', day:'numeric', weekday:'long' });
  document.getElementById('hero-date').textContent = dateStr;

  // ── Background photo
  setBgPhoto(elapsed);

  // Progress bar
  const passed = Math.max(0, Math.min(100 - currentDay, 99));
  const pct = Math.round((passed / 99) * 100);
  document.getElementById('prog-left').textContent = currentDay > 0
    ? `今天是第 ${currentDay} 天` : '旅程已完成！';
  document.getElementById('prog-pct').textContent = `${pct}% 已完成`;
  setTimeout(() => {
    document.getElementById('progress-fill').style.width = pct + '%';
  }, 300);

  // Footer year
  document.getElementById('footer-year').textContent = today.getFullYear();
})();

</script>
